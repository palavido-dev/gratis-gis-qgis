[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gratisgis-client"
version = "0.0.1.dev0"
description = "Python client for GratisGIS portals. Used by the QGIS plugin and as a standalone library."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Matthew Palavido" },
]
requires-python = ">=3.10"
keywords = ["gratisgis", "gis", "qgis", "portal", "openstreetmap", "postgis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]

[project.urls]
Homepage = "https://gratisgis.org"
Source = "https://github.com/palavido-dev/gratis-gis-qgis"
Issues = "https://github.com/palavido-dev/gratis-gis-qgis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gratisgis_client"]

# The QGIS plugin code (src/gratisgis_qgis) is NOT packaged into the
# Python wheel. It ships as a QGIS plugin zip via a separate build
# step in scripts/build-qgis-plugin.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/gratisgis_client", "tests"]

[[tool.mypy.overrides]]
module = "gratisgis_qgis.*"
ignore_errors = true
