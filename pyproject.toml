[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gratisgis-client"
dynamic = ["version"]
description = "Synchronous, dependency-free Python client for GratisGIS portals. Built to be vendored into the QGIS plugin."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Matthew Palavido" },
]
requires-python = ">=3.10"
keywords = ["gratisgis", "gis", "qgis", "portal", "openstreetmap", "postgis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

# Stdlib only, on purpose. The client vendors into the QGIS plugin
# zip, and stock QGIS Python ships no pip-installed packages (and
# cannot portably vendor compiled wheels like pydantic_core). The
# main repo's clients/python is the standalone SDK; this package
# exists to serve the plugin.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  # mypy 2.x has a typeshed loading bug ("Failed to find builtin
  # module '_typeshed'") that breaks our codebase, and 2.1.0 also
  # has an internal-error crash. Pin to the last 1.x line until
  # 2.x stabilizes.
  "mypy>=1.10,<2.0",
]

[project.urls]
Homepage = "https://gratisgis.org"
Source = "https://github.com/palavido-dev/gratis-gis-qgis"
Issues = "https://github.com/palavido-dev/gratis-gis-qgis/issues"

[tool.hatch.version]
# Single source: bump __version__ in _version.py and nothing else.
path = "src/gratisgis_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gratisgis_client"]

# The QGIS plugin code (src/gratisgis_qgis) is NOT packaged into the
# Python wheel. It ships as a QGIS plugin zip via a separate build
# step in scripts/make_zip.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/gratisgis_client", "tests"]

[[tool.mypy.overrides]]
module = "gratisgis_qgis.*"
ignore_errors = true

# Tests exercise fakes and fixtures whose exact types are noise;
# relaxing the strict-mode rules that complain about those keeps the
# signal (real type errors in test bodies) without the noise.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_unused_ignores = false
